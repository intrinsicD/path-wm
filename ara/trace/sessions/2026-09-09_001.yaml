ai_suggestions_pending:
- 'O64: Pretrained ViT supports substantially better foreground/category readouts than the local CNN, while
  P1 pixel reconstruction favors CNN. This is package selection evidence, not isolated architecture causality
  or a convolution/spatial versus transformer/semantic law.'
- 'O65: Two added convolutional or transformer blocks per CNN grid do not improve the tested capability tradeoff
  consistently. Continued encoders show fresh-geometry regression; loss balance, learning rate, gating and
  budget remain alternatives. This does not refute deeper encoders generally.'
- 'O66: Local access reduces the pretrained representation-to-image tradeoff, while output-specific computation
  changes RGB/foreground quality differently. Separate trunks strongly help RGB but lose the primary foreground
  endpoint; FiLM is not a general win. Capacity and cross-domain transfer prevent attributing all differences
  to gradient conflict.'
- 'O67: Map-distribution supervision improves per-case tolerance pass, but CNN rare errors worsen markedly.
  ViT has more consistent typical-tail gains, with mixed orientation and residual severe outliers. Neither
  mean readiness nor sharper maps establishes reliable control or calibrated confidence.'
- 'O68: Coarse PCA emphasizes global image/domain means and positional structure; corrected attention entropy
  is compatible with broad fine-directed broadcast and selective coarse-directed aggregation. Fitted interventions
  show reliance, not superiority over retrained simpler fusion.'
- 'O69: Recommend asymmetric pretrained contextual plus local features and typed decoders, retaining the fast
  CNN reference. Consumers should select named maps with native width and source time; task/encoder conditioning,
  more genuine scales and memory registers remain conditional. Future decoding needs causally predicted/aligned
  evidence and deployment training; new U/P width adapters and dynamics/control tests remain unimplemented.'
- 'O70: Existing COCO/PushT suffice for the completed reconstruction, foreground/category and static geometry
  comparisons. Next data should target broader geometry configurations and causal trajectories; computer use
  needs resolution and screenshot/action/transition evidence. Static results do not support universal application
  capability.'
- 'O71: The fixed bad pusher case has multimodal location probability and an expected coordinate between pusher
  and body regions. Boundary undercoverage and scene/object correlation are plausible upstream causes, not
  isolated mechanisms. Test prospectively separated coverage before scaling layers; argmax alone would discard
  subpixel precision.'
- 'O73: diagnostic RGB detachment and imagined-state rendering are available in the migrated recipes; the
  auxiliary-loss benefit and broader readout/retention recommendations remain untested.'
- 'O74: Optional runtime rendering and auxiliary representation training are independent; local causal task/dynamics
