  id: N541
  routing: direct
  provenance: ai-executed
  summary: Expose packed local encoder as a measured optional path; retain dense reference
- turn: 18
  type: observation
  id: O376
  routing: staged
  provenance: ai-suggested
  summary: Local-before-global processing as the higher-resolution resource direction; quality not established.
