  routing: direct
  provenance: ai-executed
  summary: Keep full-access default and adopt only exact complete-event scheduling
- turn: 17
  type: observation
  id: O375
  routing: staged
  provenance: user
  summary: Conditional token-proliferation bottleneck hypothesis; scoped measurements do not establish
    it generally.
- turn: 18
