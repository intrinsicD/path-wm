- turn: 5
  type: observation
  id: O110
  routing: staged
  provenance: ai-suggested
  summary: Propose one inspect-then-answer attempt on a stationary current target, with finite sensor
    returns and an isolated correction path. Predict action/time once per candidate; correct each return
    separately from the fixed prior. Both live and hypothetical terminal reads use corrected state plus
    pre-event memory before the real memory write. Branches retain hypothetical origin, charge only declared
    planning computation, and never fabricate external actions or evidence. A common p(Y|b) times normalized
    p(O|Y,b,a) supplies an exact finite reference; learned correction needs grounded supervision. Expected
    failures are modeled, out-of-contract returns follow predeclared abstention/error paths with executed
    effects/costs preserved.
- turn: 5
  type: observation
  id: O111
  routing: staged
  provenance: ai-suggested
  summary: Propose one model with observable outcome probabilities, proper scores, independent task calibration
    and frozen-procedure selected-risk evaluation; no calibrated model-error signal inferred from latent
    entropy. Fit a declared action-covered calibration procedure then evaluate its resulting policy independently;
    caller costs need no fitted threshold. Later ensemble comparison combines observable joint predictions
    before conditioning/selection, accounts for member-specific recurrent states/memory and reports resource
    tradeoffs. Shared heads are cheaper but blind to common encoding errors; low disagreement and mixture
    Bayes do not certify real-world correctness.
- turn: 6
