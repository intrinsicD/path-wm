  id: O112
  routing: staged
  provenance: ai-suggested
  summary: 'Propose fixed recall rounds and fixed one-inspection search with a small exact per-attempt
    budget: finite named operation groups, mandatory count caps, optional weighted work plus separate
    peak-byte/action/deadline limits, reserved actual processing and monotone spent counters. Charge new
    recomputation, release unused reserves once, preserve interrupted/unknown work status, and bind outputs
    to task/session/revision/read scope. Fixed historical scopes can finish from retained causal snapshots;
    current actions require fresh bases. Future adaptive stopping compares grounded loss improvement against
    incremental future compute cost, with the base reader frozen first and fixed schedules retained as
    controls.'
- turn: 6
  type: observation
  id: O113
  routing: staged
  provenance: ai-suggested
  summary: Propose controlled document-version/revision transfer after useful delayed learning, then an
    optional coherent moving-viewpoint task. First contrast freezes belief/dynamics/memory/read/workspace
    core, trains bounded target adapters/readouts and compares source-trained versus random frozen core
    with identical target-data/update budgets. No raw-history or independent temporal-memory adapter bypass;
    source pretraining cost reported. Distinguish same-domain generalization, supported frozen transfer,
    adapter adaptation, full fine-tuning and joint training. Use scoped truth, grouped episodes and appropriate
    proper/task scores; neither modality changes nor neutral latent interfaces prove universal world representations.
