    cannot certify named-detail fidelity.
- turn: 4
  type: observation
  id: O109
  routing: staged
  provenance: ai-suggested
  summary: Propose a narrow supervised instruction interpreter that supplies objective/entity/temporal/scope
    candidates beside an exact caller-resolved task record. Runtime owns capabilities/cost/budget/checker
    definitions. Use declared defaults autonomously and focused clarification for material ambiguity.
    Preserve executed effects/cost through revision, invalidate pending decisions and treat compensation
    as a new action. Keep delivery, prediction and verified/contradicted/unknown-with-reason separate;
    unknown scoring is task-specific, source references do not prove intent fidelity, and explicit user
    delegation can reference procedure content without promoting its source to authority.
