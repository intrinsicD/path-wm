tree:
  - id: N01
    type: question
    title: "Relevance of Michels and Sophontic to PATH-WM reasoning"
    provenance: user
    timestamp: "2026-09-03T22:05+02:00"
    description: >
      Determine whether Julian Michels's publications and Sophontic.ai provide relevant
      prior art, evidence, or methods for transition-compatible latent world models and
      path-space reasoning.
    status: resolved
    children: []

  - id: N02
    type: experiment
    title: "Step 3 vertical-slice contract validation"
    provenance: ai-executed
    timestamp: "2026-09-03T23:17+02:00"
    result: >
      The deterministic E0 environment, encoder/adapter ABI, transformer predictor,
      inverse head, training objective, data pipeline, checkpoint runner, evaluation
      metrics, and threshold layer passed the completed fast suite: 55 tests passed and
      2 threshold tests were deselected. Ruff and git diff whitespace checks were clean.
    evidence:
      - "commit:4556ea8"
      - "ara/evidence/tables/e1_dev_baseline_2026-09-03.md"
    status: resolved
    children:
      - id: N03
        type: dead_end
        title: "First full run exposed double-applied horizon curriculum"
        provenance: ai-executed
        timestamp: "2026-09-03T23:17+02:00"
        hypothesis: >
          A rollout window sized by the outer training loop could be passed to the E1
          objective, which would independently infer the same scheduled horizon.
        failure_mode: >
          The objective recomputed the curriculum from the already-truncated action
          window, reducing an intended horizon of three to two. The first 2,000-step run
          was stopped near step 1,100 when its logs revealed the mismatch.
        lesson: >
          Resolve the curriculum once against the configured maximum horizon, then require
          the sampled window to contain that many actions. A regression test now fixes this
          contract in tests/unit/test_losses.py.
        status: resolved
        children: []

      - id: N04
        type: experiment
        title: "Corrected E1 development baseline"
        provenance: ai-executed
        timestamp: "2026-09-03T23:17+02:00"
        result: >
          The corrected 2,000-step CUDA run completed on 20,480 E0 transitions. Its fixed
          256-probe evaluation measured action sensitivity 0.0022763058, one-step
          transition error 0.0003451231, and four-step transition error 0.0027015761.
          The final inverse loss was 0.3485717475. ABI thresholds remain unset, so the two
          threshold tests skipped explicitly with threshold_unset.
        evidence:
          - "runs/dev/first_slice/0/metrics.json"
          - "runs/dev/first_slice/0/run_summary.json"
          - "runs/dev/first_slice/0/training.jsonl"
          - "runs/dev/first_slice/0/threshold_record.json"
          - "ara/evidence/tables/e1_dev_baseline_2026-09-03.md"
        status: resolved
        children: []

  - id: N05
    type: experiment
    title: "Step 4 action-anchor diagnosis"
    provenance: ai-executed
    timestamp: "2026-09-04T07:16+02:00"
    result: >
      On the fixed probe, the Step 3 inverse head measured MSE 0.338520 versus the
      zero-action baseline 0.336418 with near-zero correlations. Mean pooling retained
      4.01% of full latent-delta norm, and token-aware probes on frozen W stayed at chance.
      Raw raster positions did retain signal: two-frame MSE 0.235068 and three-frame MSE
      0.112431.
    evidence:
      - "ara/evidence/tables/e1_dev_token_pair_2026-09-04.md"
      - "runs/dev/first_slice/0/checkpoint.pt"
    status: resolved
    children:
      - id: N06
        type: decision
        title: "Test token-correspondence inverse pooling as the sole model change"
        provenance: ai-suggested
        timestamp: "2026-09-04T07:16+02:00"
        choice: >
          Keep mlp_pooled_pair and checkpoint 4556ea8 as the fallback; add and select
          mlp_token_pair in a separate no-inheritance dev spec so aligned token changes
          reach the inverse loss before aggregation.
        alternatives:
          - "Raise the inverse-loss weight without changing its lossy pooling."
          - "Change E0 physics, which would invalidate an equal-data comparison."
          - "Add history/updater or counterfactual data before isolating the head."
        evidence:
          - "N05"
          - "O05"
        status: resolved
        children: []

      - id: N07
        type: experiment
        title: "Matched token-pair inverse development run"
        provenance: ai-executed
        timestamp: "2026-09-04T07:16+02:00"
        also_depends_on: [N06]
        result: >
          The 2,000-step seed-0 CUDA run completed on the same dataset and probe. Held-out
          inverse MSE improved 0.338520 to 0.210544 and s(w) improved 0.002276306 to
          0.002877012, but one-step/four-step transition errors worsened to 0.000636088 and
          0.004243674. Correct-action error did not beat zero or shuffled controls.
        evidence:
          - "commit:1148cc6"
          - "runs/dev/first_slice_token_pair/0/metrics.json"
          - "runs/dev/first_slice_token_pair/0/run_summary.json"
          - "runs/dev/first_slice_token_pair/0/threshold_record.json"
          - "ara/evidence/tables/e1_dev_token_pair_2026-09-04.md"
        status: resolved
        children:
          - id: N08
            type: dead_end
            title: "Tokenwise inverse anchoring alone fixes predictor action conditioning"
            provenance: ai-executed
            timestamp: "2026-09-04T07:16+02:00"
            hypothesis: >
              Preventing pre-pooling cancellation in the inverse head would both make W
              action-decodable and make the predictor's learned transition correctly
              depend on the supplied action.
            failure_mode: >
              Inverse decoding improved strongly, but correct-action predictor MSE was
              0.000791805 versus 0.000791497 for zero action and 0.000792345 for shuffled
              action; identity at 0.000546195 was also better than the predictor.
            lesson: >
              Inverse decodability and opposite-action separation do not establish correct
              predictor conditioning. Require action-correctness controls and a direct
              counterfactual action anchor before promotion.
            status: resolved
            children: []

      - id: N09
        type: decision
        title: "Retain the alternative but do not promote its checkpoint"
        provenance: ai-suggested
        timestamp: "2026-09-04T07:16+02:00"
        also_depends_on: [N07, N08]
        choice: >
          Preserve both inverse implementations and both run artifacts, mark the iteration
          mixed/negative, keep ABI thresholds unset, add identity/zero/shuffled controls to
          the panel, and test the predesigned counterfactual anchor next.
        alternatives:
          - "Promote the token-pair checkpoint based only on improved s(w) and inverse MSE."
          - "Delete the alternative and lose the negative-result trail."
        evidence:
          - "N07"
          - "N08"
          - "docs/design-decisions.md"
        status: resolved
        children: []

  - id: N10
    type: experiment
    title: "Action-correctness panel implementation"
    provenance: ai-executed
    timestamp: "2026-09-04T10:00+02:00"
    result: >
      Every checkpoint panel now reports correct-, identity-, zero-action, and deterministic
      shuffled-action error over the same count-by-horizon one-step cohort. An analytic oracle
      fixes the cross-trajectory shuffle semantics; 58 fast tests passed.
    evidence:
      - "commit:651db86"
      - "evaluation/metrics.py"
      - "tests/unit/test_metrics.py"
    status: resolved
    children: []

  - id: N11
    type: experiment
    title: "Paired counterfactual action-anchor development run"
    provenance: ai-executed
    timestamp: "2026-09-04T10:45+02:00"
    also_depends_on: [N09, N10]
    result: >
      Exact save/restore collection supplied 2,048 K=4 training groups and a disjoint
      256-group probe. A fresh same-GPU control matched the candidate through step 950.
      With weight 1 and κ=0.1 from stage 2, held-out accuracy remained at chance
      (0.250977), correct-action error did not beat zero action, and four-step error was
      5.27% worse than the control.
    evidence:
      - "runs/dev/first_slice_counterfactual/0/metrics.json"
      - "runs/dev/first_slice_token_pair/0/metrics.json"
      - "ara/evidence/tables/e1_dev_counterfactual_2026-09-04.md"
    status: resolved
    children:
      - id: N12
        type: dead_end
        title: "The inherited κ=0.1 placeholder tests the counterfactual anchor"
        provenance: ai-executed
        timestamp: "2026-09-04T10:45+02:00"
        hypothesis: >
          Enabling the predesigned K=4 loss at weight 1 with the inactive dev placeholder
          temperature would supply enough action-correctness gradient.
        failure_mode: >
          The observed distance-row span was about 0.0006, so κ=0.1 produced a 0.006
          logit span and a counterfactual-only gradient norm of 0.000273. Loss and accuracy
          stayed at log(4) and 1/4 despite non-vacuous rendered branches.
        lesson: >
          Calibrate κ to the MSE units before judging the objective; κ=0.001 gives a raw
          gradient norm near 1 on the same checkpoint and batch.
        status: resolved
        children: []

  - id: N13
    type: decision
    title: "Do not promote the κ=0.1 checkpoint; test scaled temperature"
    provenance: ai-suggested
    timestamp: "2026-09-04T10:45+02:00"
    also_depends_on: [N11, N12]
    choice: >
      Preserve the paired-data implementation and κ=0.1 negative run, keep ABI thresholds
      unset, and rerun with κ=0.001 as the sole change against the fresh hardware-matched
      token-pair control.
    alternatives:
      - "Reject counterfactual InfoNCE based on a configuration with effectively zero gradient."
      - "Change the predictor architecture before testing the predesigned loss at its measured scale."
    evidence:
      - "N11"
      - "N12"
      - "docs/design-decisions.md"
    status: resolved
    children: []

  - id: N14
    type: experiment
    title: "Calibrated-temperature counterfactual development run"
    provenance: ai-executed
    timestamp: "2026-09-04T11:08+02:00"
    also_depends_on: [N11, N13]
    result: >
      With κ=0.001 as the only parsed-spec change, all runs remained identical through
      step 950. Held-out K=4 accuracy rose to 0.649414 and correct actions beat shuffled
      actions, but correct-action error remained 2.36 times zero action and 10.19 times
      identity; four-step error was 8.81 times the matched control. The first active raw
      gradient norm was 178.74 before clipping, so the checkpoint was not promoted.
    evidence:
      - "runs/dev/first_slice_counterfactual_scaled/0/metrics.json"
      - "runs/dev/first_slice_counterfactual_scaled/0/training.jsonl"
      - "ara/evidence/tables/e1_dev_counterfactual_2026-09-04.md"
    status: resolved
    children: []

  - id: N15
    type: decision
    title: "Keep calibrated temperature and reduce counterfactual weight"
    provenance: ai-suggested
    timestamp: "2026-09-04T11:08+02:00"
    also_depends_on: [N14]
    choice: >
      Preserve the κ=0.001, weight-1 run as a negative result and next change only the
      counterfactual weight from 1 to 0.01. This keeps informative logits while scaling
      the onset gradient contribution from order 179 to order 1.8, comparable to the
      ordinary post-stage gradient norm.
    alternatives:
      - "Promote based on discrimination accuracy while ignoring absolute transition controls."
      - "Change predictor architecture before balancing the newly active auxiliary loss."
      - "Return to κ=0.1, where the objective has effectively no gradient."
    evidence:
      - "N14"
      - "docs/design-decisions.md"
    status: resolved
    children: []

  - id: N16
    type: decision
    title: "Replace a single follow-up weight with informed search and structural audit"
    provenance: user
    timestamp: "2026-09-04T12:06+02:00"
    also_depends_on: [N14, N15]
    choice: >
      If the failure is parametric, run an informed grid; if it is deeper, identify
      architectural or implementation causes, propose multiple remedies, and test them.
    alternatives:
      - "Run only the provisionally selected counterfactual weight 0.01."
    evidence:
      - "ara/evidence/tables/e1_dev_counterfactual_2026-09-04.md"
    status: resolved
    children: []

  - id: N17
    type: experiment
    title: "Informed counterfactual temperature and weight grid"
    provenance: ai-executed
    timestamp: "2026-09-04T12:06+02:00"
    also_depends_on: [N14, N16]
    result: >
      Seven log-spaced/refined weights at κ=0.001 plus three equal-gradient temperature
      points bracketed inactive, balanced, and over-ranked regimes. κ=0.002 and weight
      0.04 was the best pure point: accuracy 0.297852, correct actions beat zero/shuffled,
      and one-/four-step errors improved 8.37%/8.82%, but identity was 51.06% better.
    evidence:
      - "configs/dev/first_slice_counterfactual_grid_k2e3_w4e2.yaml"
      - "runs/dev/first_slice_counterfactual_grid_k2e3_w4e2/0/metrics.json"
      - "ara/evidence/tables/e1_dev_counterfactual_2026-09-04.md"
    status: resolved
    children:
      - id: N18
        type: dead_end
        title: "A scalar InfoNCE setting alone passes all E1-a action controls"
        provenance: ai-executed
        timestamp: "2026-09-04T12:06+02:00"
        hypothesis: >
          A temperature/weight region exists where branch discrimination is meaningful
          and correct-action prediction beats identity, zero, and shuffled controls.
        failure_mode: >
          Low weights remained at chance, intermediate weights beat zero/shuffle but not
          identity, and higher weights increased discrimination by sacrificing absolute
          one-step and rollout accuracy.
        lesson: >
          Stop scalar search; test relative-loss geometry, gradient routing, and state
          observability before spending more runs on finer weights.
        status: resolved
        children: []

  - id: N19
    type: experiment
    title: "Counterfactual objective geometry and gradient-routing remedies"
    provenance: ai-executed
    timestamp: "2026-09-04T12:06+02:00"
    also_depends_on: [N17, N18]
    result: >
      The control-checkpoint InfoNCE component norms were 52.71 encoder, 5.55 adapter,
      and 2.45 predictor. Predictor-only routing learned 0.46875 discrimination but made
      absolute error unusable. Adding paired diagonal MSE and sweeping measured weights
      2/6/12/24/48 produced a weight-6 Pareto point with 0.315430 discrimination,
      6.22%/14.04% gains over zero/shuffled, and 25.04%/21.28% one-/four-step gains.
    evidence:
      - "losses/counterfactual.py"
      - "runs/dev/first_slice_counterfactual_solution_predictor_only/0/metrics.json"
      - "runs/dev/first_slice_counterfactual_solution_absolute_w6/0/metrics.json"
      - "ara/evidence/tables/e1_dev_counterfactual_2026-09-04.md"
    status: resolved
    children:
      - id: N20
        type: dead_end
        title: "Preventing encoder absorption makes relative InfoNCE sufficient"
        provenance: ai-executed
        timestamp: "2026-09-04T12:06+02:00"
        hypothesis: >
          Routing the calibrated auxiliary gradient only into the predictor will preserve
          latent geometry while learning correct action semantics.
        failure_mode: >
          Held-out discrimination reached 0.46875, but one-step error rose to 0.0180226,
          still lost to zero action, and was 88.41 times identity error.
        lesson: >
          Encoder absorption is real but not causal by itself: relative-only branch ranking
          lacks an absolute positive constraint and can drive predictor overshoot directly.
        status: resolved
        children: []

  - id: N21
    type: decision
    title: "Retain paired-MSE weight 6 as E1-a Pareto checkpoint; do not promote"
    provenance: ai-suggested
    timestamp: "2026-09-04T12:06+02:00"
    also_depends_on: [N19, N20]
    choice: >
      Preserve κ=0.002, contrastive weight 0.04, and positive weight 6 as the strongest
      semantic/accuracy E1-a comparison, but do not freeze or set ABI thresholds because
      correct-action error remains 25.16% above identity.
    alternatives:
      - "Choose weight 24 solely for its lower one-step error despite weaker discrimination."
      - "Promote weight 6 while ignoring the preregistered identity control."
      - "Continue scalar objective search after the high-side bracket returned to chance."
    evidence:
      - "N19"
      - "runs/dev/first_slice_counterfactual_solution_absolute_w6/0/metrics.json"
      - "docs/design-decisions.md"
    status: resolved
    children: []

  - id: N22
    type: experiment
    title: "Hidden-velocity observability and two-frame sufficiency audit"
    provenance: ai-executed
    timestamp: "2026-09-04T12:06+02:00"
    also_depends_on: [N18, N21]
    result: >
      Opposite hidden velocities produced identical current RGB but different next RGB
      in all 64 worlds under one action. Across 3,840 fresh transitions, two-frame
      finite-difference prediction reduced next-position MSE 98.63% versus identity and
      approached the full-velocity oracle. Two committed unit regressions fix both facts.
    evidence:
      - "tests/unit/test_observability.py"
      - "ara/evidence/tables/e1_dev_counterfactual_2026-09-04.md"
    status: resolved
    children: []

  - id: N23
    type: decision
    title: "Move from E1-a loss search to the planned history-bearing E1-b updater"
    provenance: ai-suggested
    timestamp: "2026-09-04T12:06+02:00"
    also_depends_on: [N21, N22]
    choice: >
      Implement the predesigned predict-then-correct updater so history is carried in W,
      then compare it with the E1-a paired-MSE Pareto checkpoint at equal data, steps,
      seed, and panel budget before any further counterfactual parameter search.
    alternatives:
      - "Render velocity and remove E0's intended partial-observation problem."
      - "Give the Markov predictor an undeclared context window and break the ABI contract."
      - "Continue tuning E1-a despite an exact observation alias."
    evidence:
      - "N21"
      - "N22"
      - "docs/design-decisions.md"
    status: resolved
    children: []

  - id: N24
    type: question
    title: "What actually prevents early action-semantic learning?"
    provenance: user
    timestamp: "2026-09-04T12:59+02:00"
    also_depends_on: [N21, N22, N23]
    description: >
      Reconsider whether encoder readiness and curriculum are even the correct questions;
      identify why useful learning appears late, whether it can occur early, and whether
      encoders should train before predictors and planning.
    status: resolved
    children: []

  - id: N25
    type: experiment
    title: "Initialization and learning-onset audit"
    provenance: ai-executed
    timestamp: "2026-09-04T12:59+02:00"
    also_depends_on: [N24]
    result: >
      Fixed-probe snapshots showed that the default loss is off until step 1,000, initial
      W has only 0.007058 across-example variance, and the default predictor begins at
      0.310718 paired MSE versus 0.001732 for identity. All auxiliary module gradients
      were nonzero, rejecting gradient starvation. A readout scale of 0.03 matched the
      initial residual to transition scale without disconnecting actions.
    evidence:
      - "ara/evidence/tables/e1_dev_learning_onset_2026-09-04.md"
      - "evaluation/learning_curve.py"
    status: resolved
    children:
      - id: N26
        type: dead_end
        title: "Enable the full paired objective from initialization"
        provenance: ai-executed
        timestamp: "2026-09-04T12:59+02:00"
        hypothesis: >
          If the stage-2 gate is the only cause, activating the unchanged objective at
          step 0 should simply move discrimination earlier.
        failure_mode: >
          With the default residual, across-example variance fell to 0.000133 at step 200,
          held-out discrimination ended at 0.250977, and transition errors worsened.
        lesson: >
          Signal availability is not enough: the initially off-scale residual and collapse
          pressure must be controlled during representation bootstrap.
        status: resolved
        children: []

  - id: N27
    type: experiment
    title: "Joint, encoder-first, and scaled-residual curriculum comparison"
    provenance: ai-executed
    timestamp: "2026-09-04T12:59+02:00"
    also_depends_on: [N25, N26]
    result: >
      Six matched conditions showed that residual scale 0.03 enables direct early learning
      (0.525391 final discrimination), while a 200-step joint dynamics warm-up moves the
      fixed-probe 3-SE onset from step 2,000 to step 1,000 and reaches 0.535156. The latter
      narrows correct-vs-identity to 5.01%, but zero action remains 2.81% better.
    evidence:
      - "configs/dev/first_slice_onset_short_joint_warmup.yaml"
      - "runs/dev/first_slice_onset_short_joint_warmup/0/learning_curve.jsonl"
      - "ara/evidence/tables/e1_dev_learning_onset_2026-09-04.md"
    status: resolved
    children:
      - id: N28
        type: dead_end
        title: "SIGReg plus inverse is sufficient encoder pretraining"
        provenance: ai-executed
        timestamp: "2026-09-04T12:59+02:00"
        hypothesis: >
          Training encoder, adapter, and inverse before the predictor should create a
          mature action-relevant state that the predictor learns faster.
        failure_mode: >
          Scene variance reached 0.9518 at step 200, but paired identity MSE rose to 0.1611;
          the default and scaled predictor variants both learned later and underperformed
          the short joint warm-up.
        lesson: >
          Inverse decodability rewards temporal difference, not predictive smoothness.
          Encoder pretraining needs a temporal predictive target, not only SIGReg+inverse.
        status: resolved
        children: []

  - id: N29
    type: decision
    title: "Carry the short-joint onset recipe into E1-b without promoting E1-a"
    provenance: ai-suggested
    timestamp: "2026-09-04T12:59+02:00"
    also_depends_on: [N27, N28, N22]
    choice: >
      Retain transition-scale initialization plus a 200-step joint dynamics warm-up as an
      E1-b schedule candidate. Keep planning off and do not promote E1-a because no onset
      condition beats identity, zero, and shuffled controls together; test the updater
      next because curriculum cannot resolve hidden velocity.
    alternatives:
      - "Pretrain with SIGReg+inverse alone despite its measured temporal discontinuity."
      - "Continue E1-a schedule tuning despite the exact observation alias."
      - "Begin planner evaluation before a correct reference transition model exists."
    evidence:
      - "N27"
      - "N28"
      - "C06"
    status: resolved
    children: []

  - id: N30
    type: decision
    title: "Use TAU as the first real synchronized A/V corpus"
    provenance: ai-suggested
    timestamp: "2026-09-04T21:41+02:00"
    choice: >
      Use the directly archived TAU Urban Audio-Visual Scenes 2021 corpus for R0/R1.
      Decode raw media once into checksummed per-clip shards behind a versioned manifest;
      use official recording-group-disjoint folds, independent modalities in R0, and
      synchronized plus same-recording shifted views in R1.
    alternatives:
      - "VGGSound or AudioSet identifiers whose third-party video downloads are no longer stable."
      - "Ego4D, whose access and scale are too heavy for the first representation gate."
      - "A dataset-specific decoder inside the training loop."
    evidence:
      - "https://zenodo.org/records/4477542"
      - "https://dcase.community/challenge2021/task-acoustic-scene-classification"
      - "commit:0486841"
      - "commit:93eefaa"
    status: resolved
    children:
      - id: N31
        type: experiment
        title: "First real-A/V held-out R0 panel"
        provenance: ai-executed
        timestamp: "2026-09-04T21:41+02:00"
        result: >
          Ingested 20 official example clips into 9 train and 11 evaluation shards and
          completed a 20-step CUDA run. Video masked/future advantage improved from
          -2.021/-2.069 to +0.160/+0.217, but audio ended at -0.005/-0.014 and video/audio
          effective-rank fractions were 0.108/0.043 versus the frozen 0.25 gate. The
          fail-closed R0 gate rejected the checkpoint with four failures.
        evidence:
          - "commit:def60b2"
          - "runs/dev/common_base/0/representation_panel.jsonl"
          - "runs/dev/common_base/0/threshold_record.json"
          - "ara/evidence/tables/e1_common_base_r0_2026-09-04.md"
        status: resolved
        children:
          - id: N32
            type: decision
            title: "Add covariance without replacing temporal EMA learning"
            provenance: ai-suggested
            timestamp: "2026-09-04T21:41+02:00"
            choice: >
              Add a VICReg-style squared off-diagonal covariance term on valid online
              evidence tokens beside the existing variance floor. Keep masked/future EMA
              objectives unchanged, retain the effective-rank gate, and isolate weight
              scaling before testing SIGReg or projector alternatives.
            alternatives:
              - "Lower the effective-rank threshold after observing the failure."
              - "Return to SIGReg plus inverse as standalone encoder pretraining."
              - "Add whitening or a disposable regularizer projector in the same iteration."
            evidence:
              - "N31"
              - "https://arxiv.org/abs/2105.04906"
              - "docs/design-decisions.md#23-r0-dimensional-collapse-guardrail"
              - "O16"
            status: resolved
            children:
              - id: N33
                type: experiment
                title: "Matched covariance-weight and gradient-balance trials"
                provenance: ai-executed
                timestamp: "2026-09-04T21:41+02:00"
                result: >
                  Initial unweighted encoder gradients were 0.578 variance and 27.904
                  covariance. Weight 0.01 moved rank fractions to 0.115/0.047 but reduced
                  feature standard deviations from 0.755/0.727 to 0.642/0.619. A coefficient
                  of 0.002, selected from the initialization gradient audit, retained
                  0.732/0.702 spread and produced ranks 0.110/0.045. Both matched runs failed
                  the same four R0 conditions; 154 fast tests passed after implementation.
                evidence:
                  - "commit:e5d7018"
                  - "configs/dev/common_base_rank.yaml"
                  - "configs/dev/common_base_rank_balanced.yaml"
                  - "runs/dev/common_base_rank/0/representation_panel.jsonl"
