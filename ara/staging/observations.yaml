  - id: O03
    timestamp: "2026-09-03T22:05+02:00"
    provenance: ai-suggested
    content: >
      The useful transferable element from Sophontic is to make a controlled perturbation
      pair the unit of evaluation. For PATH-WM, pair-level scoring should require both the
      canonical and intervened successor to be correct and should include label-preserving
      negative controls, counterbalanced cues, held-out perturbation generators, and
      confidence intervals across seeds.
    context: >
      Mapping Sophontic's advertised flip-pair evaluation onto PATH-WM E0 and E2 paired
      save/restore interventions and counterfactual discrimination.
    potential_type: heuristic
    bound_to: [N01]
    promoted: false
    promoted_to: null
    crystallized_via: null
    stale: false

  - id: O04
    timestamp: "2026-09-03T22:05+02:00"
    provenance: ai-suggested
    content: >
      Sophontic's geometric reasoning denotes shaping LLM activation geometry for
      deductive tasks, whereas PATH-WM's latent geometry denotes a world-state metric that
      preserves dynamics and task distance for planning and encoder interoperability; the
      shared word geometry does not establish technical equivalence.
    context: >
      Conceptual comparison of Sophontic's public description with the PATH-WM v0.3 design.
    potential_type: concept
    bound_to: [N01]
    promoted: false
    promoted_to: null
    crystallized_via: null
    stale: false

  - id: O05
    timestamp: "2026-09-03T23:17+02:00"
    provenance: ai-suggested
    content: >
      The corrected E1 baseline's final inverse loss of 0.34857 is close to the 1/3
      per-component MSE expected from predicting zero for uniform actions on [-1, 1],
      while its action-sensitivity ratio is 0.002276. This pattern suggests a testable
      failure mode in which the inverse head is near the zero-predictor solution or the
      learned latents carry weak action information; the present run does not distinguish
      those explanations.
    context: >
      Diagnostic interpretation of the first completed 2,000-step E1 development run;
      transition-error metrics are available, but ABI pass/fail thresholds are still null.
    potential_type: claim
    bound_to: [N04]
    promoted: true
    promoted_to: "logic/claims.md:C01"
    crystallized_via: artifact-commitment
    stale: false

  - id: O06
    timestamp: "2026-09-04T07:16+02:00"
    provenance: ai-suggested
    content: >
      The token-pair inverse head made actions decodable from learned W (held-out MSE
      0.210544; correlations 0.63874/0.63642) but did not make the predictor use the
      correct action: correct-action transition MSE did not beat zero or shuffled controls.
    context: >
      Matched 2,000-step Step 4 development run and held-out action-correctness comparison.
    potential_type: claim
    bound_to: [N07, N08, N09]
    promoted: true
    promoted_to: "logic/claims.md:C02"
    crystallized_via: artifact-commitment
    stale: false

  - id: O07
    timestamp: "2026-09-04T07:16+02:00"
    provenance: ai-suggested
    content: >
      Treat action-sensitivity ratio as necessary but insufficient: pair it with identity,
      zero-action, and deterministic shuffled-action transition errors, and require the
      correct action to improve over those controls before accepting action conditioning.
    context: >
      Step 4 increased opposite-action separation while correct-action prediction remained
      indistinguishable from control actions.
    potential_type: heuristic
    bound_to: [N07, N08, N09]
    promoted: true
    promoted_to: "logic/solution/heuristics.md:H01"
    crystallized_via: artifact-commitment
    stale: false

  - id: O08
    timestamp: "2026-09-04T07:16+02:00"
    provenance: ai-suggested
    content: >
      E0's single RGB frame omits velocity in a force-controlled world: a two-frame
      position probe reached action MSE 0.235068, while a three-frame probe reached
      0.112431. Observation history or the planned updater may therefore be needed for a
      truly Markov world state, independently of the inverse-head pooling problem.
    context: >
      Raw-observation observability probe used to separate environment signal from learned
      representation failure before the Step 4 intervention.
    potential_type: claim
    bound_to: [N05]
    promoted: false
    promoted_to: null
    crystallized_via: null
    stale: false

  - id: O09
    timestamp: "2026-09-04T10:45+02:00"
    provenance: ai-suggested
    content: >
      The κ=0.1 counterfactual run used valid shared-snapshot branches but remained at
      chance accuracy and log(K) loss. Its mean candidate-distance span became only
      0.00597 after temperature scaling, and the counterfactual-only gradient norm was
      0.000273 versus 1.048 at κ=0.001; this configuration supplied effectively no anchor.
    context: >
      Hardware-matched token-pair/control run, completed counterfactual run, fixed paired
      probe, and temperature/gradient diagnostic.
    potential_type: claim
    bound_to: [N11, N12, N13]
    promoted: true
    promoted_to: "logic/claims.md:C03"
    crystallized_via: artifact-commitment
    stale: false

  - id: O10
    timestamp: "2026-09-04T10:45+02:00"
    provenance: ai-suggested
    content: >
      A distance-based contrastive temperature must be calibrated in the units of its
      distance metric. For the current E1 latent MSE scale, test κ=0.001 as the sole next
      change before interpreting the counterfactual objective itself as ineffective.
    context: >
      κ=0.1 compressed the observed 0.000597 distance-row span to nearly uniform logits.
    potential_type: heuristic
    bound_to: [N12, N13]
    promoted: false
    promoted_to: null
    crystallized_via: null
    stale: false

  - id: O11
    timestamp: "2026-09-04T11:08+02:00"
    provenance: ai-suggested
    content: >
      At κ=0.001 and weight 1, counterfactual ranking became learnable but overwhelmed
      absolute dynamics: held-out accuracy reached 0.649414 while one-step and four-step
      error rose 25.83 and 8.81 times above the hardware-matched control.
    context: >
      Sole-temperature-change run with identical logs through step 950 and fixed paired probes.
    potential_type: claim
    bound_to: [N14, N15]
    promoted: true
    promoted_to: "logic/claims.md:C04"
