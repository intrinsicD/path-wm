observations:
  - id: O01
    timestamp: "2026-09-03T22:05+02:00"
    provenance: ai-suggested
    content: >
      Michels's Subliminal Learning and Radiant Transmission is the closest technical
      candidate found: it proposes covariance-eigenspace overlap and output-feature-kernel
      metrics for LLM teacher-student transmission, but the accessible appendix describes
      target bands and expected outcomes rather than a completed reproducible study. It
      supplies no direct evidence for transition-compatible visual world-state latents or
      planning.
    context: >
      Literature screen of the Julian Michels PhilPapers results for relevance to PATH-WM.
    potential_type: claim
    bound_to: [N01]
    promoted: false
    promoted_to: null
    crystallized_via: null
    stale: false

  - id: O02
    timestamp: "2026-09-03T22:05+02:00"
    provenance: ai-suggested
    content: >
      Sophontic.ai currently publishes high-level method and performance claims plus an
      unreleased paired-perturbation evaluation description, but no paper, model card,
      checkpoint, code, scored evaluation report, or downloadable evaluation kit was found.
      Its model-size advantage therefore cannot yet be independently assessed.
    context: >
      Source screen of Sophontic's official site and official founder interview.
    potential_type: claim
    bound_to: [N01]
