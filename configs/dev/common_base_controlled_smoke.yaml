# PLAN — E1_common_base controlled-source training-path smoke (DDR §38).
# ABI-v2 evidence for the modality-neutral belief / replaceable H1 interface.
# Unchanged R0 frontend, 100 updates, seed 0; verify a real ledger and dashboard.
# Budget is a mechanics check, not a candidate for R1 initialization or source selection.
experiment: E1_common_base
status: dev
abi: docs/abi/abi_v2.yaml
seeds:
- 0
data:
  kind: synchronized_av_manifest
  dataset: controlled_oscillators_v1
  source:
    seed: 950101
    train_groups: 64
    eval_groups: 32
    clips_per_group: 2
    clip_duration_seconds: 8.0
    motion: dynamic
    frequency_hz:
    - 0.12
    - 0.75
    coordinate_center: 0.5
    coordinate_amplitude: 0.28
    blob_sigma_fraction: 0.075
    background_max: 0.08
    audio_base_amplitude: 0.01
    audio_coordinate_gain: 0.08
    carrier_hz:
    - 256
    - 512
    - 768
    - 1024
    - 1280
    - 1536
    - 1792
    - 2048
  shard_root: data/controlled_oscillators_v1/shards
  manifest: data/controlled_oscillators_v1/manifest.jsonl
  manifest_version: 1
  video:
    frames_per_second: 8
    resolution: 64
  audio:
    sample_rate: 16000
    channels: 1
  window:
    duration_seconds: 0.5
    future_offset_seconds: 0.5
    shifted_offset_seconds: 2.0
modalities:
  video:
    enabled: true
    encoder:
      arch: tubelet_transformer
      input_channels: 3
      dim: 96
      layers: 1
      heads: 4
      mlp_ratio: 4
      tubelet: 2
      patch: 16
    adapter:
      kind: evidence_projection
  audio:
    enabled: true
    encoder:
      arch: spectrogram_transformer
      input_channels: 1
      dim: 96
      layers: 1
      heads: 4
      mlp_ratio: 4
      sample_rate: 16000
      n_fft: 256
      hop_length: 128
      frequency_patch: 16
      time_patch: 4
    adapter:
      kind: evidence_projection
action_adapter:
  kind: continuous_mlp
  input_dim: 2
predictor:
  arch: slot_transformer
  dim: 192
  layers: 2
  heads: 4
  mlp_ratio: 4
  registers: 0
  readout_init_scale: 0.03
updater:
  kind: predict_then_correct_v2
  heads: 4
  mlp_ratio: 2
  correction_gate_bias: -1.0
representation:
  target: ema
  ema_decay: 0.996
  objectives:
  - masked_latent
  - future_latent
  - covariance
  - audiovisual_sync
  mask_ratio: 0.5
  predictor_layers: 1
  predictor_heads: 4
  audiovisual_temperature: 0.1
  weights:
    masked_latent: 1.0
    future_latent: 1.0
    variance: 0.1
    covariance: 0.002
    audiovisual_sync: 0.1
  planner_gradients: false
curriculum:
  stages:
  - representation_unimodal
  - representation_av
  - belief_bootstrap
  - dynamics_one_step
  - dynamics_rollout
  - planning
  encoder_lr_scale_after_freeze: 0.0
  observation_dropout: 0.3
  gates:
    unimodal_representation_ready:
      video_feature_std:
        op: greater_equal
        value: 0.1
      audio_feature_std:
        op: greater_equal
        value: 0.1
      video_effective_rank_fraction:
        op: greater_equal
        value: 0.25
      audio_effective_rank_fraction:
        op: greater_equal
        value: 0.25
      video_masked_prediction_advantage:
        op: greater
        value: 0.0
      audio_masked_prediction_advantage:
        op: greater
        value: 0.0
      video_future_prediction_advantage:
        op: greater
        value: 0.0
      audio_future_prediction_advantage:
        op: greater
        value: 0.0
      video_temporal_retrieval_margin:
        op: greater
        value: 0.0
      audio_temporal_retrieval_margin:
        op: greater
        value: 0.0
    audiovisual_representation_ready:
      video_to_audio_retrieval_margin:
        op: greater
        value: 0.0
      audio_to_video_retrieval_margin:
        op: greater
        value: 0.0
      synchrony_accuracy_above_chance:
        op: greater
        value: 0.0
    belief_ready:
      hidden_velocity_probe_r2:
        op: greater
        value: 0.0
      prior_only_finite:
        op: equal
        value: 1.0
    one_step_dynamics_ready:
      correct_vs_identity_ratio:
        op: less
        value: 1.0
      correct_vs_zero_ratio:
        op: less
        value: 1.0
      correct_vs_shuffled_ratio:
        op: less
        value: 1.0
    rollout_dynamics_ready:
      compounding_ratio:
        op: less_equal
        value: 1.5
      action_correct_through_horizon:
        op: equal
        value: 1.0
train:
  stage: representation_unimodal
  max_steps: 100
  batch_size: 64
  held_out_batches: 32
  log_every: 50
  precision: bf16
  optimizer: adamw
  lr: 0.0003
  weight_decay: 0.001
  grad_clip: 1.0
  checkpoint_every: 500
  prefetch_batches: 1
extensions:
  uncertainty: gated_after_deterministic_failure
  proprioception: evidence_interface
  language: io_adapter_interface
  goal_encoder: evidence_interface
  debug_decoders: stopgrad_only
  planner: frozen_world_model_only
