# PLAN — first slice (CLAUDE.md §2), step 1 written 2026-09-03.
#
# Hypothesis: H1 (transition-compatible latent interface). This slice builds the native side that
#             the E2 gate will later stitch against; it decides nothing by itself.
# Experiment: E1_reference (the first experiment that runs these modules). Roadmap phase 1 (§20).
# Modules:    Environment (E0 step + save/restore) -> Encoder (ViT-S/8) -> Adapter (linear)
#             -> Predictor (§5.6) + InverseDynamics (§5.7), trained with SIGReg + L_action + L_inverse
#             + paired-intervention L_cf (§6.1-§6.4, §6.9 stage 2). Left out: updater, planner, viewer.
# Metric:     action-sensitivity ratio s(w), one-/H-step transition error, identity/zero/shuffled-action
#             controls, and counterfactual discrimination accuracy on fixed probes under runs/<spec>/<seed>/.
# Choices that cannot be widened later (recorded in DDR §15 and §18):
#   - E0 engine in batched PyTorch on one device; every environment tensor has leading dim N (worlds).
#   - Snapshot = clone of every state tensor + the torch.Generator state; restore is bit-exact.
#   - Registers are created inside each predictor call, never passed in (DDR §13).
#
# Step 2 (2026-09-03): structural conformance tests (tests/conformance/) and the environment behaviour test
# (tests/unit/test_environment.py) committed red. What they fix for step 3 (DDR §13 items 6-11):
#   - builders build_env / build_encoder / build_adapter(cfg, z_shape) / build_predictor / build_inverse at the
#     locations in tests/conftest.py, cfg = this whole spec, CPU by default (no device key here; the runner moves modules).
#   - the tests run without autocast: consumers upcast the bf16 W explicitly and cast outputs back to the ABI dtype,
#     producers emit bf16 explicitly; the boundary LayerNorm is non-affine (abi_v1.yaml per_token_affine).
#   - the predictor readout is not zero-initialized; the inverse head is bounded with the loss before the squash.
#   - evaluation/ and the threshold tests call the predictor with k = delta_t, as training does.
#
# Step 4 iteration 1 (2026-09-04): token-correspondence inverse pooling improved held-out inverse MSE
# and s(w), but correct actions did not beat identity/zero/shuffled controls; retain this config as the
# matched before-panel without promoting its checkpoint.
#
# Step 4 iteration 2 (2026-09-04): change the objective/data only. From 50% of training, add the
# predesigned K=4 counterfactual InfoNCE term on branches collected by restore(snapshot) before every
# action. Independent sampling preserves the ordinary token-pair run's episode windows and chunk draws.
# Success requires correct-action error to beat the three controls and paired discrimination to exceed
# 1/K; s(w) alone cannot promote the checkpoint (DDR §13.18).
#
# This is a full no-inheritance dev copy. Numbers from this file are never experiment results.
experiment: E1_reference      # lineage only; writes runs/dev/first_slice_counterfactual/<seed>/
status: dev
abi: docs/abi/abi_v1.yaml
env:
  name: causal_world
  variant: deterministic
  modalities: [rgb]
  resolution: 64
  n_worlds: 64               # dev
  episode_len: 32            # dev
  dataset: data/e0_dev       # dev; shared episode store, plus paired interventions below
  n_transitions: 20480        # dev = 10 episodes x n_worlds (64) x episode_len (32)
  exploration: uniform_random # dev: the full E0 data-policy mixture arrives with its own slice
counterfactual_data:
  groups: 2048               # dev: 32 batches x 64 worlds, cycling warm-up depths 0..31
  seed: 4000003               # dev: separate from episode collection
  probe_groups: 256           # dev: held-out and fixed for the panel
  probe_seed: 8000003         # dev: disjoint from training/reset seeds
encoder:
  arch: vit_s8
  dim: 96                    # dev
  layers: 4                  # dev
  heads: 4                   # dev
  params_target: 500000       # dev; a check, not a knob
  pretrained: false
adapter:
  kind: linear
updater:
  kind: none                 # E1-a; the slice has no updater
predictor:
  arch: transformer
  dim: 192                   # dev: the ABI width, no projections
  layers: 2                  # dev
  heads: 4                   # dev
  mlp_ratio: 4
  output: delta_layernorm
  registers: 0
  markov: true
  delta_t_conditioned: true
  params_target: 1000000      # dev
inverse_dynamics:
  kind: mlp_token_pair       # matched to step 4 iteration 1
losses:
  reg: {kind: sigreg, weight: 0.1, projections: 1024, knots: 17, per_token: true}
  action: {weight: 1.0}
  rollout: {gamma: 0.9, h_train: 4, free_running: true, delta_t_max: 4}
  inverse: {weight: 1.0}
  counterfactual: {weight: 1.0, k: 4, kappa: 0.1, batch_size: 16}   # dev
curriculum:
  stage0_fraction: 0.10
  horizon_growth_fraction: 0.40
  counterfactual_from_stage: 2
train:
  steps: 2000                # dev: matched to iteration 1
  batch_size: 64             # dev
  lr: 3.0e-4                 # dev
  weight_decay: 0.001        # dev: LeWM
  grad_clip: 1.0             # dev: LeWM
  optimizer: adamw
  precision: bf16
probe_set:
  path: evaluation/probe_set_v1
  seed: 0
  count: 256                 # dev
  horizon: 4                 # dev
planner:
  kind: none
  rollout_budget: 0
seeds: [0]                   # dev
outputs:
  sigma_pilot: none
  instrument_panel: true
  metrics: [action_sensitivity_ratio, transition_error, transition_error_one_step,
            transition_error_identity, transition_error_zero_action, transition_error_shuffled_action,
            counterfactual_accuracy]
