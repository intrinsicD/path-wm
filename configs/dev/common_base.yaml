# PLAN — common multimodal base, ABI-v2 implementation slice, iteration 2, written 2026-09-04.
#
# Hypothesis: a modality-neutral recurrent belief with stable EMA-trained sensory evidence removes the
#             v1 topology mismatch and moving-target/non-Markov bootstrap failures without coupling the
#             planner to either video or audio.
# Experiment: E1_common_base R0 on the TAU Urban Audio-Visual Scenes 2021 development split; this dev
#             run validates real-data plumbing and held-out gates, not a scientific result.
# Modules:    Video/Audio EvidenceEncoder -> EvidenceAdapter -> predict-then-correct BeliefUpdater;
#             ActionAdapter -> slot WorldPredictor. A source-split manifest -> normalized clip shards ->
#             independent R0 / synchronized+shifted R1 batches is the training-only data boundary.
# Metric:     held-out per-modality feature std, effective rank, masked/future prediction advantage and
#             temporal retrieval; R1 additionally measures cross-modal retrieval and shifted synchrony.
# Data iteration 12: R1 video/audio must use one physical window-end reference; independently
# anchoring each sensor's last sample introduces a 125 ms clock offset at the full-corpus rates.
# Test aligned instants and causal, identical relative clocks across current/future/shifted views.
# Only R1 timestamp construction changes. R0 values, timestamps and random draws must replay exactly.
# This prepares correct synchronized data; real R1 training still requires the completed R0 gate/handoff.
# Curriculum iteration 13 (prepared in isolation): fresh R1 requires a completed, passing R0
# checkpoint for its seed, named by path and SHA-256 in train.r0_initialization. Verify source
# stage/budget, seed, data fingerprint, architecture and unchanged R0 thresholds before loading.
# Transfer learner/EMA weights; start a fresh optimizer and R1 random streams. Preserve provenance
# in durable snapshots so R1 resume does not depend on the original source file remaining present.
# R1 exit retains the four configured R0 feature-std/rank guards in addition to its A/V gates.
# Tests: invalid sources fail before training; weights transfer exactly; interrupted R1 is exact.
# Existing R0 runtime and ledgers must replay exactly. No real R1 starts before the full R0 decision.
# R1 panel iteration 14: measure 0.5 * dot(v_current-v_shifted, a_current-a_shifted)
# after normalizing the existing projected A/V vectors. Time-constant embeddings cancel.
# This supplemental temporal-change context adds no forwards, random draws, objective or gate.
# Test cancellation and aligned/reversed changes; replay every old R1 metric and gate exactly.
# Handoff iteration 15: analytically translate the first Fourier coordinate projection at R1
# entry so shared-window-end timestamps preserve R0 functions under its last-sample reference.
# Rotate sine/cosine weights and shift the bias for online/EMA encoder and adapter time features.
# All other parameters stay exact; no random draws, optimizer state transfer, or resume reapplication.
# Test functional equivalence, unchanged non-time weights and RNG; replay real shared-clock windows.
# Viewer iteration 16: include the three measured A/V gate values in latest-run cards when
# present. Preserve R0 cards and exact source values; no new evidence, scaling or gate changes.
experiment: E1_common_base
status: dev
abi: docs/abi/abi_v2.yaml
seeds: [0]
data:
  kind: synchronized_av_manifest
  dataset: tau_urban_audio_visual_scenes_2021
  source:
    doi: 10.5281/zenodo.4477542
    subset: examples  # dev; replace with the complete development archives for a gated run
    examples_archive: TAU-urban-audio-visual-scenes-2021-development.examples.zip
    examples_md5: 27aca1ec51f856f59604cf22e93ebf80
    metadata_archive: TAU-urban-audio-visual-scenes-2021-development.meta.zip
    metadata_md5: 76e3d7ed5291b118372e06379cb2b490
  raw_root: data/tau_urban_av_2021/raw
  metadata_root: data/tau_urban_av_2021/metadata
  shard_root: data/tau_urban_av_2021/shards_8fps_64px_16khz
  manifest: data/tau_urban_av_2021/manifest.jsonl
  manifest_version: 1
  split:
    train_file: evaluation_setup/fold1_train.csv
    eval_file: evaluation_setup/fold1_evaluate.csv
    group_column: identifier
  video:
    frames_per_second: 8
    resolution: 64
  audio:
    sample_rate: 16000
    channels: 1
  window:
    duration_seconds: 0.5
    future_offset_seconds: 0.5
    shifted_offset_seconds: 2.0
modalities:
  video:
    enabled: true
    encoder:
      arch: tubelet_transformer
      input_channels: 3
      dim: 96
      layers: 1
      heads: 4
      mlp_ratio: 4
      tubelet: 2
      patch: 16
    adapter:
      kind: evidence_projection
  audio:
    enabled: true
    encoder:
      arch: spectrogram_transformer
      input_channels: 1
      dim: 96
      layers: 1
      heads: 4
      mlp_ratio: 4
      sample_rate: 16000
      n_fft: 256
      hop_length: 128
      frequency_patch: 16
      time_patch: 4
    adapter:
      kind: evidence_projection
action_adapter:
  kind: continuous_mlp
  input_dim: 2
predictor:
  arch: slot_transformer
  dim: 192
  layers: 2
  heads: 4
  mlp_ratio: 4
  registers: 0
  readout_init_scale: 0.03
updater:
  kind: predict_then_correct_v2
  heads: 4
  mlp_ratio: 2
  correction_gate_bias: -1.0
representation:
  target: ema
  ema_decay: 0.996
  objectives: [masked_latent, future_latent, audiovisual_sync]
  mask_ratio: 0.5
  predictor_layers: 1
  predictor_heads: 4
  audiovisual_temperature: 0.1
  weights:
    masked_latent: 1.0
    future_latent: 1.0
    variance: 0.1
    audiovisual_sync: 0.1
  planner_gradients: false
curriculum:
  stages: [representation_unimodal, representation_av, belief_bootstrap,
           dynamics_one_step, dynamics_rollout, planning]
  encoder_lr_scale_after_freeze: 0.0
  observation_dropout: 0.3
  gates:
    unimodal_representation_ready:
      video_feature_std: {op: greater_equal, value: 0.1}
      audio_feature_std: {op: greater_equal, value: 0.1}
      video_effective_rank_fraction: {op: greater_equal, value: 0.25}
      audio_effective_rank_fraction: {op: greater_equal, value: 0.25}
      video_masked_prediction_advantage: {op: greater, value: 0.0}
      audio_masked_prediction_advantage: {op: greater, value: 0.0}
      video_future_prediction_advantage: {op: greater, value: 0.0}
      audio_future_prediction_advantage: {op: greater, value: 0.0}
      video_temporal_retrieval_margin: {op: greater, value: 0.0}
      audio_temporal_retrieval_margin: {op: greater, value: 0.0}
    audiovisual_representation_ready:
      video_to_audio_retrieval_margin: {op: greater, value: 0.0}
      audio_to_video_retrieval_margin: {op: greater, value: 0.0}
      synchrony_accuracy_above_chance: {op: greater, value: 0.0}
    belief_ready:
      hidden_velocity_probe_r2: {op: greater, value: 0.0}
      prior_only_finite: {op: equal, value: 1.0}
    one_step_dynamics_ready:
      correct_vs_identity_ratio: {op: less, value: 1.0}
      correct_vs_zero_ratio: {op: less, value: 1.0}
      correct_vs_shuffled_ratio: {op: less, value: 1.0}
    rollout_dynamics_ready:
      compounding_ratio: {op: less_equal, value: 1.5}
      action_correct_through_horizon: {op: equal, value: 1.0}
train:
  stage: representation_unimodal
  r0_initialization: null  # R1: map seed to {checkpoint: repo-relative-or-absolute path, sha256: digest}
  prefetch_batches: 0  # operational: 0 serial, 1 one CPU batch ahead
  max_steps: 20  # dev
  batch_size: 2  # dev
  held_out_batches: 2  # dev
  log_every: 1
  precision: bf16
  optimizer: adamw
  lr: 0.0003
  weight_decay: 0.001
  grad_clip: 1.0
extensions:
  uncertainty: gated_after_deterministic_failure
  proprioception: evidence_interface
  language: io_adapter_interface
  goal_encoder: evidence_interface
  debug_decoders: stopgrad_only
  planner: frozen_world_model_only
