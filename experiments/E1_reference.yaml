experiment: E1_reference
status: draft            # draft | frozen
abi: docs/abi/abi_v1.yaml
env:
  name: causal_world
  variant: deterministic
  modalities: [rgb]
  resolution: 64
  n_worlds: null            # set from E0 engine throughput
  episode_len: null
  dataset: data/e0_v1     # ~1M transitions, exploration mixture, paired interventions
  n_transitions: 1000000
  exploration: null        # the E0 data policy's mixture (E0_causal_world.yaml data_policy); run.py collects with it when the dataset is absent
counterfactual_data:
  groups: null             # paired one-step intervention groups in <env.dataset>/counterfactual.pt
  seed: null
  probe_groups: null       # fixed held-out paired groups for counterfactual discrimination accuracy
  probe_seed: null
encoder:
  arch: vit_s8
  dim: null                # token width; ViT-S proper (384, 12 layers, 6 heads) is 21M, the 5M target is a reduced ViT: set before E1 is frozen
  layers: null
  heads: null
  params_target: 5000000   # a check on the built model, not a knob
  pretrained: false
adapter:
  kind: linear
updater:
  kind: none               # E1-a; E1-b uses predict_then_correct
predictor:
  arch: transformer
  dim: null                # internal width: 192 (ABI width, ~2.7M at 6 layers) or 384 with in/out projections (~10.6M, the §5.6 target); set before E1 is frozen
  layers: 6
  heads: 8
  mlp_ratio: 4
  output: delta_layernorm
  registers: 0
  markov: true
  delta_t_conditioned: true
  params_target: 10000000
inverse_dynamics:
  kind: mlp_pooled_pair
losses:
  reg: {kind: sigreg, weight: null, projections: 1024, knots: 17, per_token: true}   # SIGReg as in LeWM (1024 directions, 17 knots on [0, 3]); per_token: one test per token position over the frame batch (LeWM: per time step), false pools all tokens
  action: {weight: 1.0}
  rollout: {gamma: 0.9, h_train: 8, free_running: true, delta_t_max: 8}   # delta_t_max <= abi max_chunk; from stage 1, delta_t ~ U{1..min(delta_t_max, H_train)} per batch with a k = delta_t action chunk (§6.2)
  inverse: {weight: null}
  counterfactual: {weight: null, positive_weight: null, context_gradient: true, k: 4, kappa: null, batch_size: null}
curriculum:
  stage0_fraction: 0.10
  horizon_growth_fraction: 0.40
  counterfactual_from_stage: 2
train:                     # from the LeWM recipe; set before E1 is frozen
  steps: null
  batch_size: null
  lr: null
  weight_decay: null
  grad_clip: null
  optimizer: adamw
  precision: bf16
probe_set:
  path: evaluation/probe_set_v1   # as abi_v1.yaml names it; regenerated from seed, count and horizon
  seed: 0
  count: null
  horizon: 8                      # H of the H-step transition error: free-running delta_t=1 rollout (§6.2); one-step is the k=1 term
planner:
  kind: cem
  rollout_budget: null
seeds: [0, 1, 2, 3, 4]
outputs:
  sigma_pilot: docs/preregistration.md
  instrument_panel: true
  metrics: [action_sensitivity_ratio, transition_error, transition_error_one_step,
            transition_error_identity, transition_error_zero_action, transition_error_shuffled_action,
            counterfactual_accuracy, compounding_ratio]
