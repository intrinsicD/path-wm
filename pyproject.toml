[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "path-wm"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["torch>=2.5", "torchvision", "transformers==4.57.1", "einops", "numpy", "PyYAML", "h5py", "hdf5plugin", "zstandard", "huggingface-hub"]

[project.optional-dependencies]
eval = ["gymnasium", "pygame", "pymunk==7.3.0", "opencv-python-headless", "shapely"]
data = ["zarr<3", "numcodecs"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["world_model*", "third_party*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
