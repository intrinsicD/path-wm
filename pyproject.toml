[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "path-wm"
version = "0.2.0"
description = "Small, editable PyTorch experiments for perception and world models"
requires-python = ">=3.11"
dependencies = ["torch>=2.5", "numpy>=1.24", "pillow>=10", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]
vision = ["torchvision>=0.20"]

[tool.setuptools.packages.find]
include = ["pathwm*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
